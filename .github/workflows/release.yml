# Builds a signed release APK and attaches it to a GitHub Release.
# Runs only when a tag matching v* is pushed, so branch pushes and pull
# requests never fail for lack of keystore secrets.
name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web app
        working-directory: frontend
        run: npx ng build --configuration production

      - name: Sync Capacitor Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -d "${sdk}/platforms/android-35" ] && [ -x "${sdk}/build-tools/35.0.0/apksigner" ]; then
            exit 0
          fi
          manager="$(command -v sdkmanager || true)"
          if [ -z "${manager}" ] && [ -x "${sdk}/cmdline-tools/latest/bin/sdkmanager" ]; then
            manager="${sdk}/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "${manager}" ]; then
            echo "sdkmanager not found; Gradle will use the preinstalled SDK at ${sdk}"
            exit 0
          fi
          yes | "${manager}" --sdk_root="${sdk}" "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble unsigned release APK
        working-directory: frontend/android
        run: bash ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        working-directory: frontend/android
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub secret: ${name}"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "${RUNNER_TEMP}/release.keystore"
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$unsigned" ]; then
            echo "Unsigned APK not found at ${unsigned}"
            find app/build/outputs/apk -name '*.apk' -print
            exit 1
          fi
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          bt="${sdk}/build-tools/35.0.0"
          if [ ! -x "${bt}/apksigner" ]; then
            bt="$(find "${sdk}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          fi
          "${bt}/zipalign" -p -f 4 "$unsigned" "${RUNNER_TEMP}/aligned.apk"
          "${bt}/apksigner" sign \
            --ks "${RUNNER_TEMP}/release.keystore" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out app-release-signed.apk \
            "${RUNNER_TEMP}/aligned.apk"
          "${bt}/apksigner" verify app-release-signed.apk
          rm -f "${RUNNER_TEMP}/release.keystore"

      - name: Attach APK to GitHub Release
        working-directory: frontend/android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          asset="app-release-signed.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --title "$tag" --generate-notes
          fi
